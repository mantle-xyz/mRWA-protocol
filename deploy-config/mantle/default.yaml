chainId: 5000

envs:
  # ── Wallet / RPC ──────────────────────────────────────────────
  F_WALLET_TYPE: LEDGER # options: AWS_KMS, PRIVATE_KEY, LEDGER, TREZOR, MNEMONIC
  F_PRIVATE_KEY: ""
  F_MNEMONIC: ""
  F_MNEMONIC_INDEX: 0 # also used by LEDGER/TREZOR; default 0 when omitted
  F_HARDWARE_DERIVATION_PATH: "" # optional for LEDGER/TREZOR, e.g. m/44'/60'/0'/0/0
  F_AWS_KMS_KEY_ID: ""
  F_SENDER: "0x207E804758e28F2b3fD6E4219671B327100b82f8"
  F_VERBOSE: true
  F_RPC_URL: "https://rpc.mantle.xyz"
  F_VERIFY: "true" # set to "true" to verify on broadcast; use VerifyXxx tasks to verify post-deploy

  # ── Addresses (roles) ────────────────────────────────────────
  F_ADMIN_ADDRESS: "0x207E804758e28F2b3fD6E4219671B327100b82f8"
  F_COMPLIANCE_BOT_ADDRESS: "" # SanctionsOracle COMPLIANCE_ROLE
  F_BOT_ADDRESS: "" # AccountantExecutor BOT_ROLE
  F_FEE_SETTLER_ADDRESS: "" # AccountantExecutor FEE_SETTLER_ROLE
  F_SIGNER_ADDRESS: "" # OperatorExecutor SIGNER_ROLE
  F_TREASURY_ADDRESS: "" # Vault fee share recipient
  F_SANCTION_SAFE_ADDRESS: "" # Gateway sanctionSafe (compliance escrow address)
  F_PAUSER_ADDRESS: "" # Vault + StrategyController PAUSER_ROLE
  F_CAP_MANAGER_ADDRESS: "" # Vault CAP_MANAGER_ROLE

  # ── Protocol params ────────────────────────
  F_STABLE_ADDRESS: "" # USDT0 address
  # ── Accountant params ───────────────────────
  F_INITIAL_RATE: "1000000000000000000" # 1e18 
  F_MANAGEMENT_FEE_BPS: "0" # 0%
  F_MAX_ALLOWED_DEVIATION_BPS: "100" # 1% circuit-breaker (≤MAX_DEVIATION_CEILING=1000)
  F_MIN_UPDATE_INTERVAL_SECONDS: "240" # 4 minutes
  F_MAX_COMPUTE_AGE_SECONDS: "240" # 4 minutes
  # ── StrategyController params ──────────────────
  F_BUFFER_TARGET_BPS: "100" # 1% buffer
  F_REBALANCE_THRESHOLD_BPS: "10" # 0.1% rebalance tolerance
  F_REBALANCE_COOLDOWN: "500" # 9 minutes cooldown
  # ── Vault params ──────────────────────────
  F_MAX_REDEMPTION_FEE_BPS: "0" # Maximum allowed redemption fee rate
  F_REDEMPTION_FEE_BPS: "0" # 0% redemption fee rate
  F_MIN_REDEEM_AMOUNT: "260000000000" # 1 share (6 decimals)
  F_MIN_DEPOSIT_AMOUNT: "260000000000" # 1 USDC (6 decimals)
  F_MAX_SETTLEMENT_DEVIATION_BPS: "1000" # 10% absolute cap
  F_DEPOSIT_DAILY_REMAINING: "0" # Deposit Daily caps (initial value) USDT
  F_REDEEM_DAILY_REMAINING: "0" # Redeem Daily caps (initial value) share
  F_SYNC_REDEEM_DISABLED: "true"
  F_WHITELIST_ENABLED: "true"
  
  
  # ── Existing Empty deployment ───────────────────
  DEPLOY_EMPTY_FACTORIES_BEACON_OWNER: "0x207E804758e28F2b3fD6E4219671B327100b82f8"
  EXISTING_VAULT_PROXY: ""
  UPGRADE_INIT_VAULT_FACTORY: ""
  UPGRADE_INIT_SUBRED_ADAPTER_FACTORY: ""
  UPGRADE_INIT_VAULT_PROXY: ""
  UPGRADE_INIT_ADAPTER_PROXY: ""
  
  # ── Phase A output: backfill after DeployRemainingForExistingFactories ──
  F_SANCTIONS_ORACLE_FACTORY: ""
  F_SANCTIONS_ORACLE: ""
  F_ACCOUNTANT_FACTORY: ""
  F_ACCOUNTANT: ""
  F_ACCOUNTANT_EXECUTOR: ""
  F_OPERATOR_EXECUTOR: ""
  F_STRATEGY_CONTROLLER_FACTORY: ""
  F_CONTROLLER_ADDRESS: ""
  F_GATEWAY_FACTORY: ""
  F_GATEWAY: ""
  
  # ── Phase B input: UpgradeAndInitVaultAndAdapter ──────────────
  UPGRADE_INIT_ADMIN: "0x207E804758e28F2b3fD6E4219671B327100b82f8"
  UPGRADE_INIT_STABLE: "0xcb89f5acc8f21a115192a0649fdf6b5d75880289"
  UPGRADE_INIT_GATEWAY: ""                    # filled from Phase A address dump
  UPGRADE_INIT_CONTROLLER: ""                 # filled from Phase A (uninit, init in this Phase)
  UPGRADE_INIT_ACCOUNTANT: ""                 # filled from Phase A (uninit, init in this Phase)
  UPGRADE_INIT_ACCOUNTANT_EXECUTOR: ""        # filled from Phase A (UUPS, already inited)
  UPGRADE_INIT_OPERATOR_EXECUTOR: ""          # filled from Phase A (UUPS, already inited)
  UPGRADE_INIT_TREASURY: ""                   # copy F_TREASURY_ADDRESS before Phase B
  UPGRADE_INIT_PAUSER: ""                     # copy F_PAUSER_ADDRESS before Phase B
  UPGRADE_INIT_CAP_MANAGER: ""                # copy F_CAP_MANAGER_ADDRESS before Phase B
  UPGRADE_INIT_VAULT_NAME: "Mantle DYNA"
  UPGRADE_INIT_VAULT_SYMBOL: "mDYNA"
  UPGRADE_INIT_MAX_REDEMPTION_FEE_BPS: "0"
  UPGRADE_INIT_REDEMPTION_FEE_BPS: "0"
  UPGRADE_INIT_MIN_REDEEM_AMOUNT: "260000000000"
  UPGRADE_INIT_MIN_DEPOSIT_AMOUNT: "260000000000"
  UPGRADE_INIT_MAX_SETTLEMENT_DEVIATION_BPS: "1000" # 10% absolute cap
  UPGRADE_INIT_DEPOSIT_DAILY_REMAINING: "0" # Deposit Daily caps (initial value)
  UPGRADE_INIT_REDEEM_DAILY_REMAINING: "0" # Redeem Daily caps (initial value)
  UPGRADE_INIT_ADAPTER_SUBRED_MANAGEMENT: "" # Fill in before Phase B: DigiFt SubRedManagement
  UPGRADE_INIT_ADAPTER_ST_TOKEN: "" # Fill in before Phase B: DigiFt stToken
  UPGRADE_INIT_ADAPTER_ADMIN: "0x207E804758e28F2b3fD6E4219671B327100b82f8"
  UPGRADE_INIT_ADAPTER_CONTROLLER: ""
  UPGRADE_INIT_ADAPTER_ACCOUNTANT: ""
  UPGRADE_INIT_ADAPTER_PRICE_ORACLE: "" # Fill in before Phase B: Dyan price oracle
  UPGRADE_INIT_ADAPTER_MANUAL_POS_TOKEN_PRICE: "0" # 0 = no manual price set; must be 0 when PRICE_ORACLE is non-zero
  UPGRADE_INIT_ADAPTER_SUBSCRIBE_STEP_ASSET: "10000" # USDC raw units; 10000 = 0.01 USDC subscription step
  UPGRADE_INIT_ADAPTER_REDEEM_STEP_POS: "1000000000000000000" # redeem step 1e18 = 1 stToken, 1e16 = 0.01 stToken
  UPGRADE_INIT_ADAPTER_MIN_SUBSCRIBE_ASSET: "12000000000"  # Minimum subscription $12000
  UPGRADE_INIT_ADAPTER_MIN_REDEEM_POS: "1000000000000000000000" # Minimum redemption 1000 stToken
  UPGRADE_INIT_SETTLE_MS: "5000"
  
  
  # ── Phase C: backfill / confirm before RegisterStrategy ─────────────────────
  F_STRATEGY_ADAPTER_ADDRESS: ""
  F_TARGET_WEIGHT_BPS: "10000"
  F_PRIORITY: "0"
  F_IS_ASYNC: "true"
  F_SET_ORDER: "true"
  
  # ── Phase C: TransferProtocolOwnership, execute after all checks complete ─────
  TRANSFER_OLD_ADMIN: "0x207E804758e28F2b3fD6E4219671B327100b82f8"
  TRANSFER_NEW_ADMIN: "" # Final SecurityCouncil Safe / timelock
  TRANSFER_NEW_BEACON_OWNER: "" # Final SecurityCouncil Safe / timelock
  TRANSFER_ACCEPT_DEFAULT_ADMIN: "false" # false on first run; set to true only after new admin/owner is verified
  TRANSFER_RENOUNCE_OLD_ADMIN: "false" # false on first run; set to true only after authorization/owner verification
