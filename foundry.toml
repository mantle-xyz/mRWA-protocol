[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [{ access = "read-write", path = "." }]

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
sort_imports = true

etherscan_api_key = "${ETHERSCAN_API_KEY}"

# Stress test profile — higher memory limit for long-running scenarios
[profile.stress]
memory_limit = 2_147_483_648     # 2GB


[rpc_endpoints]
mantle_sepolia = "https://rpc.sepolia.mantle.xyz"
mantle_sepolia_qa7 = "https://op-geth-rpc0-sepolia-qa7.qa4.gomantle.org"
mantle = "https://rpc.mantle.xyz"