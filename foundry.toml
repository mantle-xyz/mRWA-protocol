[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true

[profile.stress]
memory_limit = 2_147_483_648
fs_permissions = [{ access = "read-write", path = "stress_logs" }]

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
sort_imports = true

[etherscan]
mantle_sepolia = { key = "${ETHERSCAN_API_KEY}", url = "https://explorer.sepolia.mantle.xyz/api?" }
mantle = { key = "${ETHERSCAN_API_KEY}", url = "https://explorer.mantle.xyz/api?" }

[rpc_endpoints]
mantle_sepolia = "https://rpc.sepolia.mantle.xyz"
mantle_sepolia_qa7 = "https://op-geth-rpc0-sepolia-qa7.qa4.gomantle.org"
mantle = "https://rpc.mantle.xyz"
