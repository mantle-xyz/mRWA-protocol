[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
sort_imports = true

etherscan_api_key = "${ETHERSCAN_API_KEY}"


[rpc_endpoints]
mantle_sepolia = "https://rpc.sepolia.mantle.xyz"
mantle = "https://rpc.mantle.xyz"