version: 3
dotenv: ['.env']
env:
  ROOT_DIR: "{{ .ROOT_DIR }}"
  CONFIG_YAML: 
    sh: printf "%s/deploy-config/%s/%s.yaml" {{.ROOT_DIR}} {{ .NETWORK }} {{ .PROFILE | default "default" }}
  CONFIG_JSON: 
    sh: printf "%s/deploy-config/%s/%s.json" {{.ROOT_DIR}} {{ .NETWORK }} {{ .PROFILE | default "default" }}
  DEPLOYMENTS_DIR: 
    sh: printf "%s/deployments/%s" {{.ROOT_DIR}} {{ .NETWORK }}

tasks:
  test:
    cmds:
     - |
       env
  _config_yaml2json:
    internal: true
    silent: true
    desc: update json before forge script
    cmd: yq -o json {{.CONFIG_YAML}} > {{.CONFIG_JSON}}
  _script:
    internal: true
    # silent: true
    cmds:
      - task: _config_yaml2json
      - |
        export $(yq '.envs | ... comments="" | to_entries | .[] | select((.value|tostring) != "") | .key + "=" + (.value|tostring)' {{.CONFIG_YAML}})
        source {{.ROOT_DIR}}/lib/func.sh
        if [[ -z "${NETWORK}" ]]; then
          log_error "NETWORK env is empty: NETWORK=anvil task yourTask"
        fi

        mkdir -p $DEPLOYMENTS_DIR
        forge_script {{.EXTRA_ARGS}}
  _test:
    internal: true
    cmds: 
      - |
        export $(yq '.envs | ... comments="" | to_entries | .[] | select((.value|tostring) != "") | .key + "=" + (.value|tostring)' {{.CONFIG_YAML}})
        source {{.ROOT_DIR}}/lib/func.sh
        forge_test {{.EXTRA_ARGS}}
  #InitAnvilNetwork:
  #  silent: true
  #  cmds:
  #    - |
  #      NETWORK=anvil forge script script/libraries/AnvilGenesis.s.sol:AnvilGenesis
  #      yq ea 'select(fi==0).alloc = select(fi==1) | select(fi==0)' {{.ROOT_DIR}}/script/libraries/genesis.json {{.ROOT_DIR}}/state-dump/anvil/31337-default.json \
  #        > {{.ROOT_DIR}}/deploy-config/anvil/genesis.json
  InitForkedNetwork:
    # silent: true
    cmds:
      - |
        export $(yq '.envs | ... comments="" | to_entries | .[] | select((.value|tostring) != "") | .key + "=" + (.value|tostring)' {{.CONFIG_YAML}})
        source {{.ROOT_DIR}}/lib/func.sh
        sender_impersonate_safe_signer_on_forked_network deployerSafeAddress
  
  DeployAll:
    cmds:
      - task: _script
        vars:
          EXTRA_ARGS: ${ROOT_DIR}/script/DeployAll.s.sol {{.CLI_ARGS}}


  RegisterStrategy:
    cmds:
      - task: _script
        vars:
          EXTRA_ARGS: ${ROOT_DIR}/script/strategy/RegisterStrategy.s.sol {{.CLI_ARGS}}

  UpgradeAccountant:
    cmds:
      - task: _script
        vars:
          EXTRA_ARGS: ${ROOT_DIR}/script/accountant/UpgradeAccountant.s.sol {{.CLI_ARGS}}


  DeploySubRedManagementAdapter:
    cmds:
      - task: _script
        vars:
          EXTRA_ARGS: ${ROOT_DIR}/script/strategy/DeploySubRedManagementAdapter.s.sol {{.CLI_ARGS}}

  DeployMockSubRedManagement:
    cmds:
      - task: _script
        vars:
          EXTRA_ARGS: ${ROOT_DIR}/script/strategy/DeployMockSubRedManagement.s.sol {{.CLI_ARGS}}


  UpgradeStrategyController:
    cmds:
      - task: _script
        vars:
          EXTRA_ARGS: ${ROOT_DIR}/script/strategy/UpgradeStrategyController.s.sol {{.CLI_ARGS}}

  UpgradeSanctionsOracle:
    cmds:
      - task: _script
        vars:
          EXTRA_ARGS: ${ROOT_DIR}/script/compliance/UpgradeSanctionsOracle.s.sol {{.CLI_ARGS}}

  UpgradeGateway:
    cmds:
      - task: _script
        vars:
          EXTRA_ARGS: ${ROOT_DIR}/script/vault/UpgradeGateway.s.sol {{.CLI_ARGS}}

  UpgradeVault:
    cmds:
      - task: _script
        vars:
          EXTRA_ARGS: ${ROOT_DIR}/script/vault/UpgradeVault.s.sol {{.CLI_ARGS}}

  UpgradeOperatorExecutor:
    cmds:
      - task: _script
        vars:
          EXTRA_ARGS: ${ROOT_DIR}/script/protocol/UpgradeOperatorExecutor.s.sol {{.CLI_ARGS}}

  UpgradeAccountantExecutor:
    cmds:
      - task: _script
        vars:
          EXTRA_ARGS: ${ROOT_DIR}/script/accountant/UpgradeAccountantExecutor.s.sol {{.CLI_ARGS}}

  UpgradeAll:
    desc: Upgrade all upgradeable contracts (BeaconProxy + UUPS)
    cmds:
      - task: UpgradeSanctionsOracle
        vars:
          CLI_ARGS: "{{.CLI_ARGS}}"
      - task: UpgradeAccountant
        vars:
          CLI_ARGS: "{{.CLI_ARGS}}"
      - task: UpgradeStrategyController
        vars:
          CLI_ARGS: "{{.CLI_ARGS}}"
      - task: UpgradeGateway
        vars:
          CLI_ARGS: "{{.CLI_ARGS}}"
      - task: UpgradeVault
        vars:
          CLI_ARGS: "{{.CLI_ARGS}}"
      - task: UpgradeOperatorExecutor
        vars:
          CLI_ARGS: "{{.CLI_ARGS}}"
      - task: UpgradeAccountantExecutor
        vars:
          CLI_ARGS: "{{.CLI_ARGS}}"
